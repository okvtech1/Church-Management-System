<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — OKV Church Management System</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="Create your OKV Church Management System account and start your 7-day free trial — no card required.">
<link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/signup.html">
<meta name="robots" content="index, follow">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="auth-wrap">
  <div class="brand-card">
    <div class="brand-hero">
      <i class="bi bi-building"></i>
      <h4 class="fw-bold mt-3 mb-1">Create Your Church Account</h4>
      <div style="color:#c9d3ea">7-day free trial &middot; no card required</div>
    </div>
    <div class="p-4">
      <div id="planBadge" class="d-flex justify-content-between align-items-center bg-light rounded-3 px-3 py-2 mb-3">
        <div>
          <div class="small text-muted">Selected Plan</div>
          <div class="fw-bold" id="planBadgeText" style="color:var(--navy)"></div>
        </div>
        <a href="pricing.html" class="small link-gold">Change</a>
      </div>

      <form id="signupForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Organization / Business Name</label>
          <input type="text" class="form-control" id="orgName" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="phone" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="password" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password')" tabindex="-1" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="password2" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password2')" tabindex="-1" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div id="signupError" class="alert alert-danger py-2 small mb-3" style="display:none"></div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="agreeTerms" required>
          <label class="form-check-label small" for="agreeTerms">
            I agree to the <a href="terms-of-service.html" target="_blank" class="link-gold">Terms of Service</a>
            and <a href="privacy-policy.html" target="_blank" class="link-gold">Privacy Policy</a>, including how
            my Organization's data is stored and processed.
          </label>
        </div>
        <button type="submit" class="btn btn-gold w-100 mb-2" id="signupBtn">Create Account</button>
        <a href="pricing.html" class="btn btn-outline-secondary w-100">Back to Pricing</a>
        <div class="text-center mt-3 small">
          Already have an account? <a href="app.html" class="link-gold">Log in</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const plan = params.get('plan') || 'professional';
const cycle = params.get('cycle') || 'Monthly';
const PLAN_LABELS = {basic:'Starter', professional:'Professional'};

document.getElementById('planBadgeText').textContent = (PLAN_LABELS[plan]||plan) + ' — ' + cycle;

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('signupError');
  errEl.style.display = 'none';
  const orgName = document.getElementById('orgName').value.trim();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if(password !== password2){
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block';
    return;
  }
  if(!document.getElementById('agreeTerms').checked){
    errEl.textContent = 'Please agree to the Terms of Service and Privacy Policy to continue.';
    errEl.style.display = 'block';
    return;
  }
  if(!navigator.onLine){
    errEl.textContent = 'You need an internet connection to create an account.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account…';

  try{
    const passwordHash = await sha256Hex(password);
    const res = await api('signup', {orgName, username, email, phone, passwordHash, plan: PLAN_LABELS[plan]||plan, billingCycle: cycle, agreedToTerms: true});
    if(res.error){
      errEl.textContent = res.message || 'Could not create account.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create Account';
      return;
    }
    saveSession({token:res.token, ...res.user});
    window.location.href = 'install.html';
  }catch(err){
    errEl.textContent = 'Could not reach the server. Check your connection and try again.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});
</script>
<footer class="text-center text-muted small py-4">
  <i class="bi bi-envelope me-1"></i>technologyokv@gmail.com &nbsp;&middot;&nbsp;
  <i class="bi bi-telephone me-1"></i>+2348104141138 &nbsp;&middot;&nbsp;
  <i class="bi bi-globe me-1"></i>www.okvtechnology.com
  <div class="mt-2"><a href="privacy-policy.html">Privacy Policy</a> &nbsp;&middot;&nbsp; <a href="terms-of-service.html">Terms of Service</a> &nbsp;&middot;&nbsp; <a href="refund-policy.html">Refund Policy</a></div>
</footer>
</body>
</html>
