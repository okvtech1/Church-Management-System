<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — OKV Church Management System</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/reset-password.html">
<meta name="robots" content="noindex, nofollow">
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="auth-wrap">
  <div class="brand-card">
    <div class="brand-hero">
      <i class="bi bi-key"></i>
      <h4 class="fw-bold mt-3 mb-1">Reset Your Password</h4>
    </div>
    <div class="p-4">

      <div id="invalidView" style="display:none">
        <div class="alert alert-danger small" id="invalidMsg">This reset link is invalid or has expired.</div>
        <a href="app.html" class="btn btn-navy w-100">Back to Login</a>
      </div>

      <form id="resetForm" style="display:none" novalidate>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="newPassword" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword')" tabindex="-1" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="newPassword2" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword2')" tabindex="-1" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div id="resetError" class="alert alert-danger py-2 small mb-3" style="display:none"></div>
        <button type="submit" class="btn btn-gold w-100" id="resetBtn">Set New Password</button>
      </form>

      <div id="successView" style="display:none" class="text-center">
        <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem"></i>
        <p class="mt-3 mb-3">Your password has been reset.</p>
        <a href="app.html" class="btn btn-navy w-100">Log In</a>
      </div>

    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if(!token){
  document.getElementById('invalidView').style.display = 'block';
} else {
  document.getElementById('resetForm').style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('resetError');
  errEl.style.display = 'none';
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('newPassword2').value;
  if(p1 !== p2){
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const newPasswordHash = await sha256Hex(p1);
    const res = await api('resetPassword', {token, newPasswordHash});
    if(res.error){
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('invalidMsg').textContent = res.message || 'This reset link is invalid or has expired.';
      document.getElementById('invalidView').style.display = 'block';
      return;
    }
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  }catch(err){
    errEl.textContent = 'Could not reach the server. Check your connection and try again.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Set New Password';
  }
});
</script>

</footer>
</body>
</html>
